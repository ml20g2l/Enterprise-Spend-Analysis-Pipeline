name: Python regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MySQL connector used by loader tests
        run: python -m pip install -r requirements-mysql.txt
      - name: Run clone-safe regression suite
        run: python -m unittest discover -s tests -v
