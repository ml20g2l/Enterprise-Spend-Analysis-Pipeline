version: 2

models:
  - name: int_expense_contract_match
    description: "One expense with a deterministic master-data contract match and compliance classification."
    columns:
      - name: expense_id
        tests: [unique, not_null]
      - name: matched_contract_id
        tests:
          - relationships:
              to: ref('stg_synthetic_contracts')
              field: contract_id
      - name: contract_compliance_status
        tests:
          - not_null
          - accepted_values:
              values:
                - compliant_submitted_contract
                - compliant_alternate_master_match
                - compliant_master_match
                - invalid_contract_reference
                - non_compliant_vendor_mismatch
                - non_compliant_category_mismatch
                - non_compliant_outside_validity
                - no_active_matching_contract

  - name: int_expense_fx
    description: "One expense converted to GBP using identity for GBP or latest available cached rate on/before transaction date."
    columns:
      - name: expense_id
        tests: [unique, not_null]
      - name: fx_rate_to_gbp
        tests: [not_null]
      - name: amount_gbp
        tests: [not_null]

  - name: int_synthetic_spend
    description: "One fully transformed fictional expense. This is never a DEFRA transaction."
    columns:
      - name: expense_id
        tests: [unique, not_null]
      - name: department_id
        tests:
          - relationships:
              to: ref('stg_synthetic_departments')
              field: department_id
      - name: vendor_id
        tests:
          - relationships:
              to: ref('stg_synthetic_vendors')
              field: vendor_id
      - name: is_synthetic
        tests:
          - accepted_values:
              values: [1]
              quote: false

  - name: int_approval_cycles
    description: "One approval workflow per fictional expense, derived only from the four raw events."
    columns:
      - name: expense_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_synthetic_expenses')
              field: expense_id
      - name: approval_sla_breached
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false

  - name: int_vendor_satisfaction
    description: "One aggregate per fictional vendor that received at least one survey response."
    columns:
      - name: vendor_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_synthetic_vendors')
              field: vendor_id
